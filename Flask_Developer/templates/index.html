<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial;margin:0;background:#111;color:#fff}
.wrap{max-width:700px;margin:auto;padding:20px}
.msg{padding:10px;margin:8px 0;border-radius:12px}
.u{background:#2563eb}.b{background:#333}
input{width:80%;padding:12px;border-radius:8px;border:0}
button{padding:12px}
</style></head><body><div class="wrap">
<h2>{{config["TITLE"]}}</h2><p>{{config["WELCOME"]}}</p>
{% for m in history %}<div class="msg {{'u' if m.role=='user' else 'b'}}">{{m.text}}</div>{% endfor %}
<form method=post><input name=message placeholder="Ask..."><button>Send</button></form>
</div></body></html>
