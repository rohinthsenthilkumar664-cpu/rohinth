
<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#1e293b;border-radius:18px;padding:18px}
#chat{height:60vh;overflow:auto;margin:15px 0}
.m{padding:10px 14px;border-radius:14px;margin:8px 0}.u{background:{{color}};text-align:right}.a{background:#334155}
.row{display:flex;gap:10px}input{flex:1;padding:12px;border-radius:10px;border:none}button{background:{{color}};color:#fff;border:none;padding:12px 18px;border-radius:10px}
</style></head><body><div class=wrap><div class=card>
<h2>{{title}}</h2><p>{{welcome}}</p><div id=chat></div>
<div class=row><input id=msg><button onclick=send()>Send</button></div></div></div>
<script>
const c=document.getElementById('chat');
function add(t,k){let d=document.createElement('div');d.className='m '+k;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;}
async function send(){let i=document.getElementById('msg');let m=i.value.trim();if(!m)return;add(m,'u');i.value='';let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let j=await r.json();add(j.reply,'a');}
</script></body></html>
