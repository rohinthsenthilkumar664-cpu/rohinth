<!doctype html><html><head><meta name=viewport content='width=device-width,initial-scale=1'><title>AIPrompt</title><style>body{margin:0;font-family:system-ui;background:#1a0f08;color:#fff}.w{max-width:900px;margin:auto;padding:20px}.card{background:#ffffff12;border-radius:24px;padding:20px}#chat{height:60vh;overflow:auto}input{width:75%;padding:12px}button{padding:12px;background:#ea580c;color:white;border:none;border-radius:8px}</style></head><body><div class=w><div class=card><h2>AIPrompt</h2><p>{{cfg.WELCOME_MESSAGE}}</p><div id=chat></div><input id=i><button onclick=s()>Send</button><button onclick=c()>Clear</button></div></div><script>const d=document.getElementById('chat'),i=document.getElementById('i');i.onkeydown=e=>{if(e.key==='Enter')s()};async function s(){let m=i.value.trim();if(!m)return;d.innerHTML+=`<p><b>You:</b> ${m}</p>`;i.value='';let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let j=await r.json();d.innerHTML+=`<p><b>AIPrompt:</b> ${j.reply}</p>`;d.scrollTop=d.scrollHeight}async function c(){await fetch('/clear',{method:'POST'});d.innerHTML='';}</script></body></html>
